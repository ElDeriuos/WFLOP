name: Release

# Builds standalone WFLOP bundles for Linux and Windows and attaches them to a
# GitHub Release. Trigger by pushing a version tag:
#     git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Older Ubuntu = older glibc = runs on more Linux distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran make xvfb

      # STATIC=1 links the GCC runtime (libgfortran, libgomp, ...) into the
      # programs, so users need no gfortran installed
      - name: Build Fortran programs
        run: make all omp_check STATIC=1

      - name: Check programs need no gfortran runtime, and OpenMP runs threads
        run: |
          for b in build/simulator build/soga_optimizer build/moga_optimizer build/polygon3 build/omp_check; do
            ldd "$b"
            ! ldd "$b" | grep -E 'libgfortran|libgomp|libquadmath|libgcc_s' \
              || { echo "::error::$b still links the GCC runtime dynamically"; exit 1; }
          done
          OMP_NUM_THREADS=4 build/omp_check | grep -x 'threads=4'

      # Use the distribution's Python, not uv's standalone build: the standalone
      # Python ships a Tk without Xft, which makes customtkinter render blurry
      # text and jagged widget corners. deadsnakes Python links the system Tk.
      - name: Install system Python with Tk
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.14 python3.14-venv python3.14-tk libpython3.14

      - uses: astral-sh/setup-uv@v6

      - name: Build bundle
        env:
          UV_PYTHON_PREFERENCE: only-system
          UV_PYTHON: /usr/bin/python3.14
        run: |
          uv sync
          uv run pyinstaller wflop.spec --noconfirm
          cd dist && tar -czf ../WFLOP-linux-x86_64.tar.gz WFLOP

      # Fortran programs start, MP4 export works, 3D viewer renders (catches
      # VTK modules wrongly trimmed in wflop.spec)
      - name: Self-test the bundle
        run: xvfb-run -a dist/WFLOP/WFLOP --self-test

      - name: Check bundled Tk uses Xft (anti-aliased rendering)
        run: |
          internal=dist/WFLOP/_internal
          tkinter_so=$(find $internal -name '_tkinter*.so' | head -1)
          tk_lib=$(LD_LIBRARY_PATH=$internal ldd "$tkinter_so" | awk '/tk/ && /=>/ {print $3; exit}')
          echo "Tk library: $tk_lib"
          LD_LIBRARY_PATH=$internal ldd "$tk_lib" | grep -q libXft \
            || { echo "::error::Tk is not linked against Xft; GUI will render blurry"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: WFLOP-linux
          path: WFLOP-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-libgomp

      - name: Build Fortran programs
        shell: msys2 {0}
        run: make all omp_check STATIC=1

      - name: Check programs need no gfortran runtime, and OpenMP runs threads
        shell: msys2 {0}
        run: |
          for b in build/simulator build/soga_optimizer build/moga_optimizer build/polygon3 build/omp_check; do
            objdump -p "$b.exe" | grep 'DLL Name'
            ! objdump -p "$b.exe" | grep -iE 'DLL Name: (libgfortran|libgomp|libquadmath|libgcc_s|libwinpthread)' \
              || { echo "::error::$b still links the GCC runtime dynamically"; exit 1; }
          done
          OMP_NUM_THREADS=4 build/omp_check.exe | tr -d '\r' | grep -x 'threads=4'

      - uses: astral-sh/setup-uv@v6

      - name: Build bundle
        shell: pwsh
        run: |
          uv sync
          uv run pyinstaller wflop.spec --noconfirm
          Compress-Archive -Path dist/WFLOP -DestinationPath WFLOP-windows-x86_64.zip

      # GitHub's Windows runners have no GPU and only OpenGL 1.1, too old for
      # VTK (the render aborts the process). This installs Mesa's software
      # OpenGL, as pyvista's own CI does. Users' machines have real drivers.
      - uses: pyvista/setup-headless-display-action@v4

      # WFLOP.exe is a windowed app, so read its exit code and log explicitly
      - name: Self-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process dist/WFLOP/WFLOP.exe -ArgumentList '--self-test' -WorkingDirectory dist/WFLOP -Wait -PassThru
          if (Test-Path dist/WFLOP/selftest.log) { Get-Content dist/WFLOP/selftest.log }
          else { Write-Output "::error::No selftest.log: WFLOP.exe exited (code $($p.ExitCode)) before the self-test started" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: WFLOP-windows
          path: WFLOP-windows-x86_64.zip

  macos:
    # macos-14 and later are Apple Silicon (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Homebrew gcc provides gfortran and libgomp (OpenMP)
      - name: Install gfortran and Python with Tk
        run: brew install gcc python@3.14 python-tk@3.14

      - name: Build Fortran programs
        run: make all omp_check STATIC=1

      - name: Check programs need no gfortran runtime, and OpenMP runs threads
        run: |
          for b in build/simulator build/soga_optimizer build/moga_optimizer build/polygon3 build/omp_check; do
            otool -L "$b"
            ! otool -L "$b" | tail -n +2 | grep -vE '^\s*(/usr/lib/|/System/)' \
              || { echo "::error::$b links a library that is not part of macOS"; exit 1; }
          done
          OMP_NUM_THREADS=4 build/omp_check | grep -x 'threads=4'

      - uses: astral-sh/setup-uv@v6

      # Use Homebrew's Python (native Aqua Tk), not uv's standalone build,
      # for the same Tk-rendering reason as the Linux job.
      - name: Build bundle
        run: |
          export UV_PYTHON_PREFERENCE=only-system
          export UV_PYTHON="$(brew --prefix)/bin/python3.14"
          uv sync
          uv run pyinstaller wflop.spec --noconfirm
          cd dist && tar -czf ../WFLOP-macos-arm64.tar.gz WFLOP

      - name: Self-test the bundle
        run: dist/WFLOP/WFLOP --self-test

      - name: Check bundled Tk uses native Aqua rendering
        run: |
          tkinter_so=$(find dist/WFLOP/_internal -name '_tkinter*.so' | head -1)
          tk_lib=$(otool -L "$tkinter_so" | awk '/[Tt]k/ && !/_tkinter/ {print $1; exit}')
          echo "Tk library: $tk_lib"
          bundled=$(find dist/WFLOP/_internal -name "$(basename "$tk_lib")" | head -1)
          otool -L "${bundled:-$tk_lib}" | grep -q Cocoa \
            || { echo "::error::Tk is not the Aqua build; GUI will not render natively"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: WFLOP-macos
          path: WFLOP-macos-arm64.tar.gz

  release:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            WFLOP-linux-x86_64.tar.gz
            WFLOP-windows-x86_64.zip
            WFLOP-macos-arm64.tar.gz
          generate_release_notes: true

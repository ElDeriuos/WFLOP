[project]
name = "wflop"
version = "1.0.6"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "pandas>=3.0.3",
    "pyproj>=3.7.2",
    "pyvista>=0.48.4",
    "scipy>=1.18.0",
    "xarray>=2026.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: builds and runs the Fortran programs",
]

[dependency-groups]
dev = [
    "fortls>=3.2.2",
    "hypothesis>=6.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
